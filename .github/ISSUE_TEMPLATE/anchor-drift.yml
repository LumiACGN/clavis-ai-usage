name: 锚点漂移（Clavis 升级后 sync 失败）
description: Clavis 升级后 ./install.sh --sync 报「anchor matched 0 times」时使用
title: "[compat] 锚点漂移：Clavis <版本>"
labels: ["compat"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先运行下面的命令并把输出贴进来（它只打印新版上游的**公开代码文本**，
        不含任何凭据）：
        ```bash
        python3 scripts/patch_clavis_kit.py --explain-drift \
            --manifest patches/manifest.json --target <你的 Clavis 源码树> --json
        ```
  - type: input
    id: clavis-version
    attributes:
      label: Clavis 版本
      placeholder: 例如 2026.10.08（pacman -Q clavis-shell 或 RELEASE.json）
    validations:
      required: true
  - type: textarea
    id: drift-json
    attributes:
      label: explain-drift --json 输出
      render: json
    validations:
      required: true
  - type: textarea
    id: sync-log
    attributes:
      label: sync 失败时的完整报错（可选）
      render: text
    validations:
      required: false
