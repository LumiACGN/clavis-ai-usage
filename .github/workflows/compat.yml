#
# 检查 Clavis 上游的最新 release（**仅手动触发**：Actions 页 → compat-watch → Run workflow，
# 或终端 gh workflow run compat-watch）：
#   * 锚点漂移 → 自动开 issue（附补丁器的漂移报告）
#   * 锚点仍匹配但版本更新 → 开一条“可更新基线”的提醒
name: compat-watch

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取上游最新 release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/StatIndet/quickshell/releases/latest --jq '.tag_name')
          url=$(gh api repos/StatIndet/quickshell/releases/latest --jq '.tarball_url')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          curl -sSL "$url" -o up.tar.gz
          mkdir up && tar -xzf up.tar.gz -C up --strip-components=1

      - name: 对最新上游跑补丁器（dry-run）
        id: try
        run: |
          set -uo pipefail
          if python3 scripts/patch_clavis_ai_card.py --target up --dry-run >/tmp/drift.txt 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
          python3 scripts/patch_clavis_ai_card.py --target up --explain-drift --json >/tmp/drift.json 2>&1 || true

      - name: 漂移 → 开 issue
        if: steps.try.outputs.ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(jq -r '.upstream.version' patches/manifest.json)
          gh issue create \
            --title "[compat] 锚点漂移：Clavis ${{ steps.up.outputs.tag }}（基线 $ver）" \
            --body "$(printf '自动巡检发现锚点在最新上游不匹配。\n\n补丁器输出：\n```\n%s\n```\n\n漂移报告（JSON）：\n```json\n%s\n```\n\n修复流程见 patches/README.md。' "$(cat /tmp/drift.txt)" "$(cat /tmp/drift.json)")" \
            || true

      - name: 版本更新但锚点仍匹配 → 开提醒
        if: steps.try.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(jq -r '.upstream.version' patches/manifest.json)
          tag="${{ steps.up.outputs.tag }}"
          if [ "$tag" != "v$ver" ] && [ "$tag" != "$ver" ]; then
            gh issue create \
              --title "[compat] Clavis $tag 可用（锚点仍匹配，当前基线 $ver）" \
              --body "补丁器对 $tag 全部锚点匹配。可更新 patches/manifest.json 的 upstream.version/upstream_sha256 并跑一遍测试。" \
              || true
          fi
