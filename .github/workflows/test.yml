name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq rsync

      - name: 补丁器测试（幂等/回滚/漂移）
        run: python3 -m unittest discover -s tests -v

      - name: manifest 自检
        run: python3 tests/test_manifest.py

      - name: 后端契约测试（假 HOME）
        run: tests/test_backend.sh

      - name: overlay 彩排（假 HOME + 假树，端到端）
        run: tests/test_overlay.sh
